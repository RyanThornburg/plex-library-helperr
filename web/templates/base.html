<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Helperr{% endblock %}</title>
  {# root relative: behind cloudflared the app sees http, so absolute urls would be http:// #}
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Helperr</a>
    <span class="user">{{ user }}</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
